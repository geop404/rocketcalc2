name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential libssl-dev libffi-dev python3-dev
        pip install --upgrade pip setuptools
        pip install cython buildozer kivy

    - name: Install Android SDK cmdline tools and packages
      env:
        ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      run: |
        set -e
        SDK_ROOT="$HOME/android-sdk"
        sudo apt-get update
        sudo apt-get install -y curl unzip
        mkdir -p "$SDK_ROOT/cmdline-tools"
        cd $RUNNER_TEMP
        curl -sSLo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools.zip
        mv cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
        ls -R "$SDK_ROOT/cmdline-tools/latest"
        echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV
        echo "PATH=$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/build-tools/33.0.1:$PATH" >> $GITHUB_PATH
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
        "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.1" "ndk;25.1.8937393" "cmdline-tools;latest"
    - name: Build APK
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROIDSDK: $HOME/android-sdk
        ANDROIDNDK: $HOME/android-sdk/ndk/25.1.8937393
        ANDROID_NDK_HOME: $HOME/android-sdk/ndk/25.1.8937393
        ANDROID_NDK_ROOT: $HOME/android-sdk/ndk/25.1.8937393
      run: |
        buildozer android release

    - name: Upload APK
      uses: actions/upload-artifact@v4
