name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip cython git openjdk-11-jdk-headless build-essential
        pip install --upgrade pip
        pip install buildozer kivy
    
    - name: Build APK
      run: buildozer android release
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: apk-release
        path: bin/*.apk
        retention-days: 30
